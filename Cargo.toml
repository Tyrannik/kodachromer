[workspace]
resolver = "3"
members = ["crates/remjet-core", "crates/remjet-cli", "crates/remjet"]

[workspace.package]
version = "0.1.0-alpha.6"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/Tyrannik/remjet"
description = "Film emulation for Leica M9 DNGs, starting with Kodachrome 64"

# Image processing is unusably slow without optimisation, even while developing.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
