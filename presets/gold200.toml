# Kodak Gold 200 (C-41) printed on Kodak Professional Endura Premier
# paper (RA-4) — spectral negative/print model.
#
# The negative, from Kodak publication E-7022 (KODAK GOLD 200 Film,
# technical data), digitised from the PDF's vector plots:
#   - characteristic curves: Status M density, C-41 process, daylight
#   - spectral sensitivity of the three layers
#   - spectral diffuse density of a mid-scale neutral and of the minimum
#     density (the orange mask)
# E-7022 publishes no MTF, so no film sharpness is modelled.
# The paper, from Kodak publication E-4070 (KODAK PROFESSIONAL ENDURA
# PREMIER Paper, technical data), identical to the [print] data in
# portra400.toml. E-7022 names no paper; Gold is printed here on the same
# Endura Premier paper as Portra 400 and Ektar 100.
# Printed through its printing densities, as for Portra 400 (see
# crates/remjet-core/src/spectral.rs).

id = "gold200"
name = "Gold 200"
version = 1
process = "negative"

[exposure]
# Scene-linear camera value treated as an 18% grey card (app calibration).
grey_linear = 0.12
# E-7022's "Log H Ref" for a correctly exposed grey (ISO 200).
log_h_ref = -1.14

[look]
interimage = 0.0
contrast = 1.0
flare = 0.004

[scan]
# The print is viewed as it is: paper white to paper black, already
# grey-balanced by the printer lights.
black_density = 3.0
neutral_balance = 0.0
gamma = 1.0
white_balance = [1.0, 1.0, 1.0]

[grain]
# Kodak publishes no rms granularity for Gold 200, only Print Grain Index
# (44 at 4x6 from 35 mm, against Portra 400's 37). This value is an
# estimate, scaled up from Portra 400's; applied to the negative's density.
rms_granularity = 4.8
correlation = 0.75
blur_px = 1.3
amount = 0.4

[halation]
# Glow from light reflecting off the film base into the red layer (per-image
# Halation slider; 0 by default). Same character settings as Kodachrome 64.
radius_px = 40.0
threshold_stops = 1.75
tint = [1.0, 0.22, 0.04]

[datasheet]
densitometry = "status_m"

# Status M density vs log10 exposure (lux-seconds). E-7022's blue curve dips
# by 0.03 at the very bottom of the toe; it is held at its minimum there so
# density never falls as exposure rises.
