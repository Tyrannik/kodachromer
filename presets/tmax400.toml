# Push and pull processing (per-image Development menu). F-4043 publishes
# D-76 small-tank curves (20 °C) for 6, 8 and 11 minutes. It says a one-stop
# push needs no extra development, gives 9 1/4 min in D-76 for EI 1600, and
# does not recommend D-76 for EI 3200. The 6- and 11-minute curves stand in
# for a one-stop pull and a two-stop push.

[[datasheet.development]]
push = -1
label = "Pull 1 (EI 200)"
source = "F-4043: D-76, small tank, 20 °C, 6 min"

