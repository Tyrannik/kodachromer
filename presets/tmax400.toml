# Kodak Professional T-Max 400 (400TMY) developed in D-76 — black-and-white
# negative, lab-scanned.
#
# Built from Kodak publication F-4043 (KODAK PROFESSIONAL T-MAX 400 Film,
# technical data, February 2016), digitised from the PDF's vector plots:
#   - characteristic curve: diffuse visual density, KODAK PROFESSIONAL D-76
#     Developer, small tank, 20 °C, 8 minutes. Of the three published times
#     (6, 8 and 11 min) this is the closest to Kodak's printing aim of
#     contrast index 0.56.
#   - spectral sensitivity (log sensitivity, the dotted curve for D = 1.0
#     above D-min, as for Tri-X)
#   - MTF (D-76, diffuse visual)
#   - diffuse rms granularity: 10 (D-76)
# One silver image, so every channel shares the same curve and the result is
# exactly neutral. Like Tri-X, the negative is viewed through the lab scanner
# used for the colour negatives (see crates/remjet-core/src/spectral.rs).

id = "tmax400"
name = "T-Max 400"
version = 1
process = "monochrome"

[exposure]
# Scene-linear camera value treated as an 18% grey card (app calibration).
grey_linear = 0.12
# Its exposure on the film: ISO 400 with standard meter calibration,
# H = 8 / S lux-seconds -> log10(0.02). F-4043 gives no Log H Ref.
log_h_ref = -1.70

[look]
interimage = 0.0
contrast = 1.0
flare = 0.004

[scan]
black_density = 3.0
neutral_balance = 0.0
gamma = 1.0
white_balance = [1.0, 1.0, 1.0]

[grain]
# Diffuse rms granularity (x1000, 48 µm aperture, at net density 1.0) from
# F-4043 (D-76). Silver grain has no colour, so it is the same in every
# channel.
rms_granularity = 10.0
correlation = 1.0
blur_px = 1.2
amount = 0.4

[halation]
# Glow from light reflecting off the film base (per-image Halation slider;
# 0 by default). Neutral for a black-and-white film.
radius_px = 40.0
threshold_stops = 1.75
tint = [1.0, 1.0, 1.0]

[datasheet]
densitometry = "diffuse_visual"

# Diffuse visual density vs log10 exposure (lux-seconds), D-76 8 min.
[datasheet.curves.neutral]
start = -3.50
step = 0.05
