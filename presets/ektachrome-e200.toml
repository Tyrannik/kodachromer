# Kodak Professional Ektachrome E200 (E-6) — spectral model.
#
# Built entirely from Kodak publication E-28 (KODAK PROFESSIONAL
# EKTACHROME Film E200, technical data, 2005; the film was discontinued),
# digitised from the PDF's vector plots:
#   - characteristic curves: Status A density, E-6 process, daylight
#   - spectral sensitivity of the three layers (log sensitivity)
#   - spectral dye density of the cyan, magenta and yellow dyes, and the
#     visual neutral they form (normalised to 1.0, 5000 K viewing)
#   - MTF of each layer (the green curve is drawn as many small filled
#     pieces in the PDF; their centres are used)
#   - diffuse rms granularity: 12
# Kodak describes E200 as having the lower contrast of a 100-speed slide
# film and being built for push processing.
# Everything under [look], [scan], [grain] (except rms_granularity),
# [halation] and [projection] is a tunable aesthetic parameter, set as for
# Ektachrome E100.

id = "ektachrome-e200"
name = "Ektachrome E200"
version = 1
process = "reversal"

[exposure]
# Scene-linear camera value treated as an 18% grey card (app calibration).
grey_linear = 0.12
# Its exposure on the film: ISO 200 with standard meter calibration,
# H = 8 / S lux-seconds -> log10(0.04).
log_h_ref = -1.40

[look]
# The datasheet gives no interimage data; the measured curves and dyes
# already carry the film's colour, so this starts at 0.
interimage = 0.0
contrast = 1.0
flare = 0.004

[scan]
# Density the scanner maps to black. Lower = more open shadows.
black_density = 3.0
# 0 = the slide's own colour on a 5000 K light box,
# 1 = scanner grey-balanced at mid-grey.
neutral_balance = 1.0
gamma = 1.15
white_balance = [1.0, 1.0, 1.0]

[grain]
# Diffuse rms granularity (x1000, 48 µm aperture) from E-28, applied to the
# developed dye amounts.
rms_granularity = 12.0
correlation = 0.85
blur_px = 1.1
amount = 0.4

[halation]
# Glow from light reflecting off the film base into the red layer (per-image
# Halation slider; 0 by default). Same character settings as Kodachrome 64.
radius_px = 40.0
threshold_stops = 1.75
tint = [1.0, 0.22, 0.04]

[projection]
# Used when an image's Output is "Projected slide".
flare = 0.003
white_balance = [1.04, 1.0, 0.90]
falloff_stops = 0.35

[datasheet]
densitometry = "status_a"

