# Push and pull. E-28 gives starting points for push processing but no
# curves: lab push 1 (8 min first developer) for EI 320, push 2 (11 min) for
# EI 640 and push 3 (13 min) for EI 800, "with only minimal shifts in
# contrast and color balance". So the curves are modelled as for E100 (a
# full stop faster per push, steeper about grey, thinner blacks; the pull
# the reverse), but with about half E100's contrast change. Push 2 here
# (EI 800) is Kodak's push 3 process; push 1 (EI 400) falls between its
# push 1 and push 2. Shown as "modelled" in the app.

[[datasheet.development]]
push = -1
label = "Pull 1 (EI 100)"
source = "modelled: shorter first developer"
model = { contrast = [0.94, 0.94, 0.94], shift = [-0.301, -0.301, -0.301], pivot = 1.13 }

[[datasheet.development]]
push = 1
label = "Push 1 (EI 400)"
source = "E-28: between lab push 1 (EI 320, 8 min) and push 2 (EI 640, 11 min); curves modelled"
model = { contrast = [1.06, 1.06, 1.06], shift = [0.301, 0.301, 0.301], pivot = 1.13, max_density_drop = 0.1 }

[[datasheet.development]]
push = 2
label = "Push 2 (EI 800)"
source = "E-28: lab push 3, 13 min first developer, for EI 800; curves modelled"
model = { contrast = [1.12, 1.12, 1.12], shift = [0.602, 0.602, 0.602], pivot = 1.13, max_density_drop = 0.25 }
