[dyes]
# Integral (scanner R, G, B) density per unit of each dye's own-band density,
# averaged from the E-55 spectral dye-density curves over 630–670 nm (R),
# 530–560 nm (G) and 430–470 nm (B). Rows: R, G, B. Columns: cyan, magenta, yellow.
# Note the magenta dye's large blue absorption (0.247).
matrix = [
  [1.000, 0.076, 0.007],
  [0.038, 1.000, 0.036],
  [0.045, 0.247, 1.000],
]

[exposure]
# Scene-linear camera value treated as an 18% grey card, and the green
# density it should produce on the slide.
grey_linear = 0.12
grey_density = 1.0

[look]
# Layer exposure from linear Rec.2020 (rows: red-, green-, blue-sensitive
# layers). Off-diagonals model overlapping spectral sensitivities.
sensitivity = [
  [0.94, 0.06, 0.00],
  [0.02, 0.88, 0.10],
  [0.00, 0.06, 0.94],
]
# Interimage effect: each layer's log exposure is pushed away from the mean of
# the three, increasing saturation as K-14 development does.
interimage = 0.20

[scan]
# Density the scanner maps to black. Lower = more open shadows.
black_density = 3.0
# 0 = raw Status A balance, 1 = scanner grey-balanced at grey_density.
neutral_balance = 1.0
# Scanner software gamma (>1 opens shadows the way scan software does).
gamma = 1.15
# Scanner colour balance (R, G, B): a little warmth typical of K64 scans.
white_balance = [1.02, 1.0, 0.95]

[grain]
# Diffuse rms granularity (x1000, 48 µm aperture) from the datasheet.
rms_granularity = 10.0
# 0..1 share of grain common to all three layers (luminance-like).
correlation = 0.85
# Grain clump size (blur of the noise), in pixels at full resolution. ~1.1 px
# reads as fine dye clouds at a 4000 dpi scan rather than single-pixel noise.
blur_px = 1.1
# Overall multiplier. Pure aperture scaling of the datasheet figure ignores the
# scanner's MTF and overstates grain at pixel level; 0.3 matches 4000 dpi
# K64 scans by eye, 0.4 reads a little more clearly in finished images.
amount = 0.4
