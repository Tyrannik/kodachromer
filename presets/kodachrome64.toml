# Kodachrome 64 — scanned-slide emulation.
#
# Measured data digitised from the vector plots in Kodak publication E-55
# (KODACHROME 25, 64 and 200 Professional Film, 06/2009), Kodachrome 64 page:
#   - characteristic curves: Status A density, K-14 process, daylight, 1/50 s
#   - spectral dye-density curves (normalised to a visual neutral of 1.0)
#   - diffuse rms granularity: 10
# Everything under [look] and [scan] is a tunable aesthetic parameter.

id = "kodachrome64"
name = "Kodachrome 64"
version = 1

[curves]
# Status A integral density vs log10 exposure (lux-seconds), per channel.
