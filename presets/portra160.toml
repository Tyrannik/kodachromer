# Kodak Professional Portra 160 (C-41) printed on Kodak Professional Endura
# Premier paper (RA-4) — spectral negative/print model.
#
# The negative, from Kodak publication E-4051 (KODAK PROFESSIONAL PORTRA 160
# Film, technical data, January 2025), digitised from the PDF's vector plots:
#   - characteristic curves: Status M density, C-41 process, daylight
#   - spectral sensitivity of the three layers
#   - spectral diffuse density of a mid-scale neutral and of the minimum
#     density (the orange mask)
#   - MTF of each layer
# The paper, from Kodak publication E-4070 (KODAK PROFESSIONAL ENDURA
# PREMIER Paper, technical data), identical to the [print] data in
# portra400.toml.
# Printed through its printing densities, as for Portra 400 (see
# crates/remjet-core/src/spectral.rs).

id = "portra160"
name = "Portra 160"
version = 1
process = "negative"

[exposure]
# Scene-linear camera value treated as an 18% grey card (app calibration).
grey_linear = 0.12
# E-4051's "Log H Ref" for a correctly exposed grey (ISO 160).
log_h_ref = -1.05

[look]
interimage = 0.0
contrast = 1.0
flare = 0.004

[scan]
# The print is viewed as it is: paper white to paper black, already
# grey-balanced by the printer lights.
black_density = 3.0
neutral_balance = 0.0
gamma = 1.0
white_balance = [1.0, 1.0, 1.0]

[grain]
# Kodak publishes no rms granularity for Portra 160, only Print Grain Index
# (28 at 4x6, 50 at 8x10, 79 at 16x20 from 35 mm, between Ektar 100's
# <25 / 38 / 66 and Portra 400's 37 / 59 / 89). This value is an estimate,
# interpolated between theirs; applied to the negative's density.
rms_granularity = 3.3
correlation = 0.75
blur_px = 1.3
amount = 0.4

[halation]
# Glow from light reflecting off the film base into the red layer (per-image
# Halation slider; 0 by default). Same character settings as Kodachrome 64.
radius_px = 40.0
threshold_stops = 1.75
tint = [1.0, 0.22, 0.04]

[datasheet]
densitometry = "status_m"

