# Kodak Professional Ektachrome E100 (E-6) — spectral model.
#
# Built entirely from Kodak publication E-4000 (KODAK PROFESSIONAL
# EKTACHROME Film E100, technical data), digitised from the PDF's vector
# plots:
#   - characteristic curves: Status A density, E-6 process, daylight
#   - spectral sensitivity of the three layers (log sensitivity, 380–700 nm)
#   - spectral dye density of the cyan, magenta and yellow dyes, and the
#     visual neutral they form (normalised to 1.0, 5000 K viewing)
#   - MTF of each layer
#   - diffuse rms granularity: 8
# Nothing here is shared with the Kodachrome 64 matrix model: layer
# exposure, dye amounts and colour on the light box are all computed from
# these spectra (see crates/remjet-core/src/spectral.rs).
# Everything under [look], [scan], [grain] (except rms_granularity),
# [halation] and [projection] is a tunable aesthetic parameter.

id = "ektachrome-e100"
name = "Ektachrome E100"
version = 1
process = "reversal"

[exposure]
# Scene-linear camera value treated as an 18% grey card (app calibration).
grey_linear = 0.12
# Its exposure on the film: ISO 100 with standard meter calibration,
# H = 8 / S lux-seconds -> log10(0.08).
log_h_ref = -1.10

[look]
# The datasheet gives no interimage data; the measured curves and dyes
# already carry the film's colour, so this starts at 0.
interimage = 0.0
contrast = 1.0
flare = 0.004

[scan]
# Density the scanner maps to black. Lower = more open shadows.
black_density = 3.0
# 0 = the slide's own colour on a 5000 K light box (E100 runs slightly cool),
# 1 = scanner grey-balanced at mid-grey.
neutral_balance = 1.0
gamma = 1.15
white_balance = [1.0, 1.0, 1.0]

[grain]
# Diffuse rms granularity (x1000, 48 µm aperture) from E-4000, applied to the
# developed dye amounts.
rms_granularity = 8.0
correlation = 0.85
blur_px = 1.1
amount = 0.4

[halation]
# Glow from light reflecting off the film base into the red layer (per-image
# Halation slider; 0 by default). Same character settings as Kodachrome 64.
radius_px = 40.0
threshold_stops = 1.75
tint = [1.0, 0.22, 0.04]

[projection]
# Used when an image's Output is "Projected slide".
flare = 0.003
white_balance = [1.04, 1.0, 0.90]
falloff_stops = 0.35

[datasheet]
densitometry = "status_a"

