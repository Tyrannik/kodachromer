# Push and pull processing (per-image Development menu). F-4016 publishes
# D-76 small-tank curves (20 °C) for 6, 7 1/2 and 10 minutes. Its push table
# gives D-76 times of 6 1/2 min for EI 200 (the normal time) and 8 1/4 min
# for EI 400, and does not recommend D-76 for EI 800. The 7 1/2- and
# 10-minute curves stand in for push 2 and push 3. There is no shorter
# curve, so the pull is modelled: the measured 6 -> 7 1/2 min step
# (contrast 1.24 about fog, 0.106 log H faster, RMS error 0.016 D) reversed.

[[datasheet.development]]
push = -1
label = "Pull 1 (EI 50)"
source = "modelled: the measured F-4016 D-76 6 -> 7 1/2 min step, reversed"
model = { contrast = [0.809, 0.809, 0.809], shift = [-0.106, -0.106, -0.106] }

[[datasheet.development]]
push = 1
label = "Push 1 (EI 200)"
source = "F-4016: EI 200 with the normal D-76 time (6 1/2 min); 6 min curve"

[[datasheet.development]]
push = 2
label = "Push 2 (EI 400)"
source = "F-4016: D-76, small tank, 20 °C, 7 1/2 min (Kodak gives 8 1/4 min)"

