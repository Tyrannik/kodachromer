# Kodak Professional Tri-X 400 (400TX) developed in D-76 — black-and-white
# negative, lab-scanned.
#
# Built from Kodak publication F-4017 (KODAK PROFESSIONAL TRI-X 320 and 400
# Films, technical data, December 2016), digitised from the PDF's vector
# plots:
#   - characteristic curve: diffuse visual density, 400TX 35 mm, KODAK
#     PROFESSIONAL D-76 Developer, large tank, agitation at 1-minute
#     intervals, 20 °C, 8 minutes. Of the four published times (6, 8, 10,
#     12 min) this is the closest to Kodak's printing aim of contrast
#     index 0.56; its speed point (0.1 over fog) gives ISO 360, close to box speed.
#   - spectral sensitivity (log sensitivity, the solid curve, labelled
#     D = 1.0 above gross fog)
#   - MTF (D-76, diffuse visual)
#   - diffuse rms granularity: 17
# One silver image, so every channel shares the same curve and the result is
# exactly neutral. There is no paper data in F-4017, so the negative is
# viewed through the lab scanner used for the colour negatives (see
# crates/remjet-core/src/spectral.rs).

id = "trix400"
name = "Tri-X 400"
version = 1
process = "monochrome"

[exposure]
# Scene-linear camera value treated as an 18% grey card (app calibration).
grey_linear = 0.12
# Its exposure on the film: ISO 400 with standard meter calibration,
# H = 8 / S lux-seconds -> log10(0.02). F-4017 gives no Log H Ref.
log_h_ref = -1.70

[look]
interimage = 0.0
contrast = 1.0
flare = 0.004

[scan]
black_density = 3.0
neutral_balance = 0.0
gamma = 1.0
white_balance = [1.0, 1.0, 1.0]

[grain]
# Diffuse rms granularity (x1000, 48 µm aperture, at net density 1.0) from
# F-4017 (measured in HC-110 dilution B). Silver grain has no colour, so it
# is the same in every channel.
rms_granularity = 17.0
correlation = 1.0
blur_px = 1.3
amount = 0.4

[halation]
# Glow from light reflecting off the film base (per-image Halation slider;
# 0 by default). Neutral for a black-and-white film.
radius_px = 40.0
threshold_stops = 1.75
tint = [1.0, 1.0, 1.0]

[datasheet]
densitometry = "diffuse_visual"

# Diffuse visual density vs log10 exposure (lux-seconds).
[datasheet.curves.neutral]
start = -3.45
step = 0.05
