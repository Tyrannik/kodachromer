neutral = [106.8, 109, 110.3, 110.5, 107.7, 103.6, 98.5, 91.4, 73.6, 55.4, 39, 26.4]

# Push and pull processing (per-image Development menu). F-4017 publishes
# 400TX 35 mm D-76 curves (large tank, 20 °C) for 6, 8, 10 and 12 minutes.
# Its tables give 7 3/4 min for EI 400 and 10 3/4 min for EI 1600, and say
# the film can be rated one stop faster with normal development. The 6- and
# 12-minute curves stand in for a one-stop pull and a three-stop push.

[[datasheet.development]]
push = -1
label = "Pull 1 (EI 200)"
source = "F-4017: D-76, large tank, 20 °C, 6 min"

