# Kodak Professional Portra 800 (C-41) printed on Kodak Professional Endura
# Premier paper (RA-4) — spectral negative/print model.
#
# The negative, from Kodak publication E-4040 (KODAK PROFESSIONAL PORTRA 800
# Film, technical data, January 2025), digitised from the PDF's vector plots:
#   - characteristic curves: Status M density, C-41 process, daylight, at
#     EI 800 (normal) and at EI 1600 (push 1) and EI 3200 (push 2)
#   - spectral sensitivity of the three layers
#   - spectral diffuse density of a mid-scale neutral and of the minimum
#     density (the orange mask)
#   - MTF of each layer
# The paper, from Kodak publication E-4070 (KODAK PROFESSIONAL ENDURA
# PREMIER Paper, technical data), identical to the [print] data in
# portra400.toml.
# Printed through its printing densities, as for Portra 400 (see
# crates/remjet-core/src/spectral.rs).

id = "portra800"
name = "Portra 800"
version = 1
process = "negative"

[exposure]
# Scene-linear camera value treated as an 18% grey card (app calibration).
grey_linear = 0.12
# E-4040's "Log H Ref" for a correctly exposed grey (ISO 800).
log_h_ref = -1.74

[look]
interimage = 0.0
contrast = 1.0
flare = 0.004

[scan]
# The print is viewed as it is: paper white to paper black, already
# grey-balanced by the printer lights.
black_density = 3.0
neutral_balance = 0.0
gamma = 1.0
white_balance = [1.0, 1.0, 1.0]

[grain]
# Kodak publishes no rms granularity for Portra 800, only Print Grain Index
# (48 at 4x6, 70 at 8x10, 99 at 16x20 from 35 mm, against Portra 400's
# 37 / 59 / 89). This value is an estimate, scaled up from Portra 400's in
# line with Gold 200 (44) and Ultramax 400 (46); applied to the negative's
# density.
rms_granularity = 5.6
correlation = 0.75
blur_px = 1.3
amount = 0.4

[halation]
# Glow from light that passes through the film, reflects off the back of the
# base and exposes the emulsion again. Mostly red: the reflected light
# re-exposes the bottom, red-sensitive layer first.
# Protection: anti-halation undercoat. Kodak publishes no halation figure, so
# the strength (0..1, 1 = no protection at all) is an estimate by type of
# protection, set by eye; the per-image Halation control starts here.
backing = "anti-halation undercoat"
strength = 0.1
# Base thickness sets the spread (sigma = 1.45 x base): 0.10 mm ESTAR thick
# base (E-4040).
base_um = 100.0
radius_px = 40.0
# Only highlights brighter than this many stops over mid-grey glow. Kept low
# because the camera clips light sources at only ~3 stops over grey.
threshold_stops = 1.75
tint = [1.0, 0.22, 0.04]

[datasheet]
densitometry = "status_m"

