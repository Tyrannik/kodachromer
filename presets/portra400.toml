# Kodak Professional Portra 400 (C-41) printed on Kodak Professional Endura
# Premier paper (RA-4) — spectral negative/print model.
#
# The negative, from Kodak publication E-4050 (KODAK PROFESSIONAL PORTRA 400
# Film, technical data), digitised from the PDF's vector plots:
#   - characteristic curves: Status M density, C-41 process, daylight
#   - spectral sensitivity of the three layers
#   - spectral diffuse density of a mid-scale neutral and of the minimum
#     density (the orange mask)
#   - MTF of each layer
# The paper, from Kodak publication E-4070 (KODAK PROFESSIONAL ENDURA
# PREMIER Paper, technical data):
#   - characteristic curves: Status A reflection density
#   - spectral sensitivity of the three layers
#   - spectral dye density of the cyan, magenta and yellow dyes
# The negative is printed through its *printing* densities: gains from
# Status M to the paper's own spectral sensitivity are computed from the
# negative's spectra, and printer lights are solved so the reference grey
# prints neutral. Nothing here is shared with the Kodachrome 64 matrix
# model (see crates/remjet-core/src/spectral.rs).

id = "portra400"
name = "Portra 400"
version = 1
process = "negative"

[exposure]
# Scene-linear camera value treated as an 18% grey card (app calibration).
grey_linear = 0.12
# E-4050's "Log H Ref" for a correctly exposed grey (ISO 400).
log_h_ref = -1.44

[look]
interimage = 0.0
contrast = 1.0
flare = 0.004

[scan]
# The print is viewed as it is: paper white to paper black, already
# grey-balanced by the printer lights.
black_density = 3.0
neutral_balance = 0.0
gamma = 1.0
white_balance = [1.0, 1.0, 1.0]

[grain]
# Kodak publishes no rms granularity for Portra 400, only Print Grain Index
# (37 at 4x6, 59 at 8x10, 89 at 16x20 from 35 mm). This value is an
# estimate, applied to the negative's density; print contrast amplifies it.
rms_granularity = 4.0
correlation = 0.75
blur_px = 1.3
amount = 0.4

[halation]
# Glow from light that passes through the film, reflects off the back of the
# base and exposes the emulsion again. Mostly red: the reflected light
# re-exposes the bottom, red-sensitive layer first.
# Protection: anti-halation undercoat. Kodak publishes no halation figure, so
# the strength (0..1, 1 = no protection at all) is an estimate by type of
# protection, set by eye; the per-image Halation control starts here.
backing = "anti-halation undercoat"
strength = 0.1
# Base thickness sets the spread (sigma = 1.45 x base): 0.10 mm ESTAR thick
# base (E-4050).
base_um = 100.0
radius_px = 40.0
# Only highlights brighter than this many stops over mid-grey glow. Kept low
# because the camera clips light sources at only ~3 stops over grey.
threshold_stops = 1.75
tint = [1.0, 0.22, 0.04]

[datasheet]
densitometry = "status_m"

