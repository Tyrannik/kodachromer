# Push and pull. E-163 gives no push data, so these are modelled exactly as
# for E100 (a full stop faster per push, steeper about grey, thinner
# blacks; the pull the reverse), pivoting on E100VS's own grey density
# (about 1.09). Shown as "modelled" in the app.

[[datasheet.development]]
push = -1
label = "Pull 1 (EI 50)"
source = "modelled: shorter first developer"
model = { contrast = [0.88, 0.88, 0.88], shift = [-0.301, -0.301, -0.301], pivot = 1.09 }

[[datasheet.development]]
push = 1
label = "Push 1 (EI 200)"
source = "modelled: longer first developer"
model = { contrast = [1.12, 1.12, 1.12], shift = [0.301, 0.301, 0.301], pivot = 1.09, max_density_drop = 0.15 }

[[datasheet.development]]
push = 2
label = "Push 2 (EI 400)"
source = "modelled: longer first developer"
model = { contrast = [1.25, 1.25, 1.25], shift = [0.602, 0.602, 0.602], pivot = 1.09, max_density_drop = 0.35 }
