# Kodak Professional Ektachrome E100VS (E-6) — spectral model.
#
# Built entirely from Kodak publication E-163 (KODAK PROFESSIONAL
# EKTACHROME Film E100VS, technical data; the film was discontinued in
# 2012), digitised from the PDF's vector plots:
#   - characteristic curves: Status A density, E-6 process, daylight
#   - spectral sensitivity of the three layers (log sensitivity)
#   - spectral dye density of the cyan, magenta and yellow dyes, and the
#     visual neutral they form (normalised to 1.0, 5000 K viewing)
#   - MTF of each layer
#   - diffuse rms granularity: 11
# "VS" is Very Saturated. Its published curves, sensitivities and dyes are
# close to E100's: Kodak got the saturation mostly from interlayer
# (interimage) effects between the layers, which a datasheet's single-layer
# plots don't show (see [look] below and crates/remjet-core/src/spectral.rs).
# Everything under [look], [scan], [grain] (except rms_granularity),
# [halation] and [projection] is a tunable aesthetic parameter, set as for
# Ektachrome E100.

id = "ektachrome-e100vs"
name = "Ektachrome E100VS"
version = 1
process = "reversal"

[exposure]
# Scene-linear camera value treated as an 18% grey card (app calibration).
grey_linear = 0.12
# Its exposure on the film: ISO 100 with standard meter calibration,
# H = 8 / S lux-seconds -> log10(0.08).
log_h_ref = -1.10

[look]
# The datasheet gives no interimage data; the measured curves and dyes
# already carry the film's colour, so this starts at 0.
interimage = 0.0
contrast = 1.0
flare = 0.004

[scan]
# Density the scanner maps to black. Lower = more open shadows.
black_density = 3.0
# 0 = the slide's own colour on a 5000 K light box,
# 1 = scanner grey-balanced at mid-grey.
neutral_balance = 1.0
gamma = 1.15
white_balance = [1.0, 1.0, 1.0]

[grain]
# Diffuse rms granularity (x1000, 48 µm aperture) from E-163, applied to the
# developed dye amounts.
rms_granularity = 11.0
correlation = 0.85
blur_px = 1.1
amount = 0.4

[halation]
# Glow from light that passes through the film, reflects off the back of the
# base and exposes the emulsion again. Mostly red: the reflected light
# re-exposes the bottom, red-sensitive layer first.
# Protection: anti-halation undercoat. Kodak publishes no halation figure, so
# the strength (0..1, 1 = no protection at all) is an estimate by type of
# protection, set by eye; the per-image Halation control starts here.
backing = "anti-halation undercoat"
strength = 0.08
# Base thickness sets the spread (sigma = 1.45 x base): 5 mil (0.13 mm)
# acetate (E-163).
base_um = 130.0
radius_px = 40.0
# Only highlights brighter than this many stops over mid-grey glow. Kept low
# because the camera clips light sources at only ~3 stops over grey.
threshold_stops = 1.75
tint = [1.0, 0.22, 0.04]

[projection]
# Used when an image's Output is "Projected slide".
flare = 0.003
white_balance = [1.04, 1.0, 0.90]
falloff_stops = 0.35

[datasheet]
densitometry = "status_a"

