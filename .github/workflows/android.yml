# Builds the Android app (android/) into an installable APK.
#
# Runs on pushes and pull requests that touch the app or the Rust code it
# uses, and is called by release.yml to attach the APK to a release. The APK
# is uploaded as the "Remjet-<version>-android" artifact; see docs/ANDROID.md
# for installing it on a phone.
name: Android

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - "crates/remjet-core/**"
      - "crates/remjet-android/**"
      - "presets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "crates/remjet-core/**"
      - "crates/remjet-android/**"
      - "presets/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact:
        description: Name of the uploaded APK artifact
        value: ${{ jobs.apk.outputs.artifact }}

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.apk.outputs.artifact }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Test the Android bindings
        run: cargo test -p remjet-android --locked

      # The runner image ships the Android SDK and NDK (cargo-ndk finds it
      # through ANDROID_NDK_ROOT). Android 7.0 (API 24) is the oldest version
      # the app supports.
      - name: Build native libraries
        run: >
          cargo ndk --platform 24 -t arm64-v8a -t armeabi-v7a
          -o android/app/src/main/jniLibs
          build --release --locked -p remjet-android

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        id: apk
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          name="Remjet-$v-android"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$name.apk"
          ls -l dist
          echo "artifact=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.artifact }}
          path: dist/*.apk
          if-no-files-found: error
